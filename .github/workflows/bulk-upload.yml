name: "🚀 Full Bulk Upload | Elastic Pulse"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elastic-pulse-sync
  cancel-in-progress: false

jobs:
  initialize:
    name: "01 - Initialize Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: "🚀 Initialize"
        run: |
          echo "ELASTIC PULSE - FULL BULK UPLOAD"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

  setup:
    name: "02 - Setup Python & Dependencies"
    runs-on: ubuntu-latest
    needs: initialize
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "📦 Validate requirements"
        run: |
          test -f requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "✅ Dependencies installed successfully."

  validate-config:
    name: "03 - Validate Configuration"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: "🔐 Check required secrets"
        env:
          database_url: ${{ secrets.DATABASE_URL }}
          elastic_cloud_id: ${{ secrets.ELASTIC_CLOUD_ID }}
          elastic_API_key: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          set -euo pipefail
          for name in database_url elastic_cloud_id elastic_API_key; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret for $name"
              exit 1
            fi
          done
          echo "✅ Required configuration is present."

  execute-sync:
    name: "04 - Execute Full Bulk Upload"
    runs-on: ubuntu-latest
    needs: validate-config
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "🩺 Start FastAPI and run upload"
        env:
          database_url: ${{ secrets.DATABASE_URL }}
          elastic_cloud_id: ${{ secrets.ELASTIC_CLOUD_ID }}
          elastic_API_key: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          set -euo pipefail

          nohup uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 \
            > fastapi.log 2>&1 &
          echo $! > uvicorn.pid

          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail \
              http://127.0.0.1:8000/healthy \
              -o /tmp/health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat uvicorn.pid)" 2>/dev/null; then
              cat fastapi.log
              exit 1
            fi
            echo "Waiting for API ($i/30)..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat fastapi.log
            exit 1
          fi

          echo "📤 Triggering full upload..."
          CODE=$(curl --silent --show-error \
            -X POST http://127.0.0.1:8000/products/bulkupload \
            -H "Content-Type: application/json" \
            -o response.json -w "%{http_code}")

          echo "HTTP status: $CODE"
          cat response.json

          if [[ ! "$CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Bulk upload endpoint failed."
            exit 1
          fi

      - name: "📤 Save sync result and logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-upload-result
          path: |
            response.json
            fastapi.log
          if-no-files-found: ignore
          retention-days: 3

      - name: "🧹 Stop FastAPI"
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" 2>/dev/null || true
          fi

  validate-results:
    name: "05 - Validate Results & Report"
    runs-on: ubuntu-latest
    needs: execute-sync
    if: always()
    steps:
      - name: "📥 Download sync result"
        uses: actions/download-artifact@v4
        with:
          name: bulk-upload-result
          path: sync-output
        continue-on-error: true

      - name: "📊 Validate upload counts"
        env:
          EXECUTION_RESULT: ${{ needs.execute-sync.result }}
        run: |
          set -euo pipefail

          if [ "$EXECUTION_RESULT" != "success" ]; then
            echo "::error::The upload execution job failed."
            if [ -f sync-output/fastapi.log ]; then
              cat sync-output/fastapi.log
            fi
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          path = "sync-output/response.json"
          try:
              with open(path, encoding="utf-8") as f:
                  result = json.load(f)
          except Exception as exc:
              sys.exit(f"Cannot read API response: {exc}")

          if not isinstance(result, dict):
              sys.exit("Unexpected API response.")

          for key in ("total_submitted", "uploaded", "failed"):
              if key not in result:
                  sys.exit(f"Missing result field: {key}")

          submitted = result["total_submitted"]
          uploaded = result["uploaded"]
          failed = result["failed"]

          for name, value in (
              ("total_submitted", submitted),
              ("uploaded", uploaded),
              ("failed", failed),
          ):
              if isinstance(value, bool) or not isinstance(value, int):
                  sys.exit(f"Invalid count: {name}")

          print("\n========== FULL BULK UPLOAD REPORT ==========")
          print(f"Submitted: {submitted}")
          print(f"Uploaded:  {uploaded}")
          print(f"Failed:    {failed}")

          if failed > 0:
              sys.exit("Some documents failed indexing.")

          print("✅ No indexing failures reported.")
          PY

      - name: "🎉 Pipeline completed"
        if: success()
        run: |
          echo "✅ FULL BULK UPLOAD SUCCESSFUL"

      - name: "❌ Pipeline failed"
        if: failure()
        run: |
          echo "::error::Full bulk upload pipeline failed."